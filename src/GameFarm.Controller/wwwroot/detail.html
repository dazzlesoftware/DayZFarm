<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client Detail</title>
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<header class="topbar">
  <h1>CLIENT DETAIL</h1>
  <a href="/" style="color:var(--accent)">&larr; Back to farm</a>
</header>
<main>
  <div id="detail" class="tile" style="max-width:640px;display:flex;flex-direction:column;gap:10px;padding:20px;"></div>
  <div class="bulk-actions" id="detail-actions" style="margin-top:16px;"></div>

  <section style="margin-top:24px;max-width:480px;">
    <h2 style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;">Edit Client</h2>
    <form id="edit-form" class="tile" style="padding:16px;display:flex;flex-direction:column;gap:8px;">
      <label>Steam Account (label only) <input name="steamAccountName" /></label>
      <label>Server Address <input name="serverAddress" required /></label>
      <label>Server Port <input name="serverPort" type="number" required /></label>
      <label>
        Server Password <span id="server-password-status" style="color:var(--text-dim);font-size:12px;"></span>
        <input name="serverPassword" type="password" autocomplete="new-password" placeholder="Leave blank to keep the current password" />
      </label>
      <label><input name="clearServerPassword" type="checkbox" /> Clear stored password</label>
      <label>Required Mods (comma-separated Workshop IDs) <input name="requiredMods" /></label>
      <label><input name="autoStart" type="checkbox" /> Auto-start VM</label>
      <label><input name="autoReconnect" type="checkbox" /> Auto-reconnect</label>
      <label><input name="autoUpdate" type="checkbox" /> Auto-update</label>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button type="submit">Save Changes</button>
      </div>
    </form>
  </section>

  <section style="margin-top:24px;max-width:900px;">
    <h2 style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;">Mods</h2>
    <div id="mods-panel" class="tile" style="padding:16px;"></div>
    <div class="bulk-actions" style="margin-top:8px;">
      <button id="ensure-mods-btn">Ensure Mods</button>
    </div>
  </section>

  <section style="margin-top:24px;max-width:900px;">
    <h2 style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;">Guest Plugins</h2>
    <p style="color:var(--text-dim);font-size:12px;margin:4px 0 8px;">
      Admin-configured commands that run inside this client's own VM. Add one by placing a JSON
      file under <code>C:\GameFarmAgent\Plugins\</code> on the VM — see docs/PLUGINS.md.
    </p>
    <div id="guest-plugins-panel" class="tile" style="padding:16px;"></div>
  </section>

  <section style="margin-top:24px;max-width:900px;">
    <h2 style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;">Logs</h2>
    <div class="bulk-actions" style="margin-bottom:8px;">
      <button id="refresh-logs-btn">Refresh Logs</button>
    </div>
    <div>
      <strong style="font-size:12px;color:var(--text-dim);">Game log <span id="dayz-log-source"></span></strong>
      <pre id="dayz-log" class="tile" style="max-height:260px;overflow:auto;padding:12px;font-size:11px;white-space:pre-wrap;"></pre>
    </div>
    <div>
      <strong style="font-size:12px;color:var(--text-dim);">Controller action log</strong>
      <pre id="action-log" class="tile" style="max-height:200px;overflow:auto;padding:12px;font-size:11px;white-space:pre-wrap;"></pre>
    </div>
  </section>
</main>
<script src="/js/detail.js"></script>
</body>
</html>
